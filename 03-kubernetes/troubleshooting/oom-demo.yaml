
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-demo
  namespace: ai-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-demo
  template:
    metadata:
      labels:
        app: oom-demo
    spec:
      containers:
        - name: memory-consumer
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |
              import time
              memory = []
              while True:
                  memory.append(bytearray(10 * 1024 * 1024))
                  print(f"Allocated approximately {len(memory) * 10} MiB", flush=True)
                  time.sleep(1)
          resources:
            requests:
              memory: "32Mi"
            limits:
              memory: "64Mi"
